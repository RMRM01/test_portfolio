<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Navbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #222;
      padding: 10px 20px;
      color: white;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #00ffaa;
    }

    .profile-pic {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .profile-pic:hover {
      transform: scale(18);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">My Portfolio</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <!-- Replace src with your own image link -->
    <img src="profilepicture.jpg" alt="Owner" class="profile-pic">
  </nav>

</body>
</html>
